<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>스도쿠 듀얼</title>
<script>try{var r=document.documentElement,o=JSON.parse(localStorage.getItem('sd_theme_obj')||'null');if(o){r.dataset.theme=o.base;for(var k in o.vars)r.style.setProperty(k,o.vars[k])}else{r.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}}catch(e){}</script>
<style>
:root{--bg:#fff;--paper:#fff;--edge:#e3e8ef;--ink:#344861;--mute:#6e7c91;--line:#bec6d4;--blue:#325aaf;--user:#0072e3;
--sel:#bbdefb;--rel:#e2ebf3;--same:#c3d7ea;--bad:#e55c6c;--bad-bg:#f7cfd6;
--me:#0072e3;--me-bg:#dbeafe;--op:#111827;--op-bg:#e5e7eb;--card:#f5f7fa;
--theirs-bg:#eceff3;--theirs-ink:#000;--opcur:#000}
:root[data-theme=dark]{color-scheme:dark;--bg:#121826;--paper:#1b2333;--edge:#2c3750;--ink:#d7deea;--mute:#93a0b5;--line:#3a4559;--blue:#4f86f0;--user:#6cb4ff;
--sel:#2f5486;--rel:#232e45;--same:#33496b;--bad:#ff7b8a;--bad-bg:#4a2530;
--me:#5aa9ff;--me-bg:#1d3556;--op:#e5e7eb;--op-bg:#2c3240;--card:#222c44;
--theirs-bg:#3a4150;--theirs-ink:#fff;--opcur:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px;padding:18px 14px 40px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em;color:var(--blue)}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--paper);border:1px solid var(--edge);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(52,72,97,.06)}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input[type=text],input[type=password]{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none;margin-bottom:10px}
input:focus{border-color:var(--blue)}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg label{flex:1;text-align:center;padding:9px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;color:var(--mute)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--blue);color:#fff;border-color:var(--blue)}
.cap{font-size:12px;color:var(--mute);margin:-4px 0 10px}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:600;background:var(--blue);color:#fff}
.btn.sec{background:var(--paper);color:var(--blue);border:1px solid var(--blue)}
.btn.gray{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.or{text-align:center;color:var(--mute);font-size:13px;margin:12px 0}
.userbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:15px}
.userbar button{border:0;background:none;color:var(--mute);font-size:13px;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--edge)}
th{color:var(--mute);font-weight:500;font-size:12px}td.n{text-align:left}
.empty{color:var(--mute);text-align:center;font-size:14px;padding:10px}

/* 대결 화면 */
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:2px 2px 8px}
.meta b{color:var(--ink)}
.hud{display:flex;gap:8px;margin-bottom:10px}
.pc{flex:1;border-radius:12px;padding:8px 10px;border:2px solid var(--edge);background:var(--card);min-width:0}
.pc.me{border-color:var(--me);background:var(--me-bg)}
.pc.op{border-color:var(--op);background:var(--op-bg);text-align:right}
.pc .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sc{font-size:24px;font-weight:700;line-height:1.15}
.pc .hp{font-size:12px;min-height:16px}
.pc .fz{font-size:12px;color:#0369a1;min-height:14px}
.bar{height:6px;border-radius:3px;background:rgba(52,72,97,.12);margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--me);transition:width .3s}
.pc.op .bar i{background:var(--op);margin-left:auto}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:15px}
.boardbox{position:relative}
.board{display:grid;grid-template-columns:repeat(9,1fr);border-left:2px solid var(--ink);border-top:2px solid var(--ink);background:var(--paper);aspect-ratio:1;user-select:none;touch-action:manipulation}
.c{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:clamp(18px,6vw,30px);cursor:pointer;position:relative;color:var(--user);transition:background .1s}
.c.cr{border-right:2px solid var(--ink)}
.c.rb{border-bottom:2px solid var(--ink)}
.c.rel{background:var(--rel)}
.c.same{background:var(--same)}
.c.given{color:var(--ink);font-weight:500}
.c.bad{color:var(--bad);background:var(--bad-bg)}
.c.mine{background:var(--me-bg);color:var(--me);font-weight:600}
.c.theirs{background:var(--theirs-bg);color:var(--theirs-ink);font-weight:700}
.c.sel{background:var(--sel)}
.c.opcur{box-shadow:inset 0 0 0 3px var(--opcur);z-index:2}
.c.opcur::after{content:'';position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--opcur)}
.c.pop{animation:pop .3s}
.c.shake{animation:shake .3s}
.nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(8px,2.4vw,12px);color:var(--mute);font-weight:500}
.nt span{display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.board.dim{filter:blur(7px);pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.ov .box{background:var(--paper);border:1px solid var(--edge);border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:0 8px 30px rgba(52,72,97,.15)}
.code{font-size:40px;font-weight:800;letter-spacing:.18em;margin:6px 0 10px;color:var(--blue)}
.big{font-size:84px;font-weight:800;color:var(--blue)}
.res{font-size:30px;font-weight:800;margin-bottom:4px}.res.w{color:var(--me)}.res.l{color:var(--bad)}
.frz{position:absolute;inset:0;background:rgba(186,230,253,.55);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#0369a1;pointer-events:none}
.ctl{display:flex;justify-content:space-around;margin:12px 0 4px}
.ctl button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);font-size:12px;padding:4px 8px;position:relative;min-width:64px}
.ctl .ic{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px}
.ctl button:disabled{opacity:.35}
.ctl .badge{position:absolute;top:0;right:8px;background:var(--blue);color:#fff;font-size:11px;border-radius:9px;min-width:18px;padding:1px 5px}
.ctl .badge.off{background:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}
.pad button{padding:8px 0 6px;font-size:clamp(22px,7vw,34px);border:0;background:var(--card);border-radius:8px;color:var(--user);font-weight:400}
.pad button:active{background:var(--sel)}
.pad button:disabled{opacity:.2}
.pad.notes button{color:var(--mute)}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{padding:10px;font-size:14px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.banner{background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;text-align:center}
.hide{display:none!important}
/* 로비 개편 */
#lobby.authed>h1,#lobby.authed>.sub{display:none}
#lobby.authed .tabp:not(.on){display:none}
#lobby.authed .wrap,#lobby.authed{padding-bottom:84px}
.topbar{display:flex;align-items:center;gap:8px;margin:2px 44px 12px 0}
.tb-who{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coinpill{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:5px 14px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dailypill{border:0;border-radius:999px;padding:7px 12px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(50,90,175,.45)}50%{box-shadow:0 0 0 7px rgba(50,90,175,0)}}
.hero{background:var(--blue);color:#fff;border-radius:16px;padding:18px 16px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(50,90,175,.25)}
.hero-t{font-size:19px;font-weight:800}
.hero-s{font-size:13px;opacity:.85;margin:2px 0 12px}
.hseg{margin:0 0 12px}
.hseg label{border-color:rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.08)}
.hseg label:has(input:checked){background:#fff;color:var(--blue);border-color:#fff;font-weight:700}
.hero-go{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:var(--blue);font-size:18px;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 8px;border:1px solid var(--edge);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(52,72,97,.06)}
.tile .ti{font-size:26px}.tile b{font-size:15px}.tile .ts{font-size:11.5px;color:var(--mute)}
.tile:active{transform:scale(.98)}
.ct{font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cnt{font-size:12px;color:var(--mute);font-weight:500}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--edge)}
.rrow:last-child{border-bottom:0}
.rrow .rn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rt{font-size:12px;color:var(--mute);margin-top:2px;font-weight:400}
.rrow button{flex:0 0 auto;padding:8px 14px;border-radius:9px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-size:13px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--paper);border-top:1px solid var(--edge);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 0 9px;color:var(--mute);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--blue)}.nav button.on i{filter:none;opacity:1}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-body{position:relative;width:100%;max-width:520px;background:var(--paper);border-radius:20px 20px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:2px 0 14px;cursor:pointer}
label.chk input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
label.chk span{color:var(--mute);font-size:12px}

.themebtn{position:fixed;top:10px;right:12px;z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--paper);font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.solo .pc.op{display:none}
.legend{display:flex;gap:12px;align-items:center;justify-content:center;font-size:12px;color:var(--mute);margin:0 0 8px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid;border-radius:3px;margin-right:4px;vertical-align:-3px}
.rainbow{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent}
.ttl{font-size:11px;color:var(--mute);margin-right:5px;font-weight:500;-webkit-text-fill-color:currentColor}
.coinbar{font-variant-numeric:tabular-nums}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{border:1px solid var(--edge);border-radius:12px;padding:10px;background:var(--paper);text-align:center;font-size:13px}
.item.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.item .nm{font-weight:600;margin-bottom:6px;min-height:20px}
.item .sw{height:34px;border-radius:8px;margin-bottom:6px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:22px}
.item .pr{color:var(--mute);font-size:12px;margin-bottom:4px}
.item button{width:100%;padding:7px;font-size:13px;border-radius:8px;border:1px solid var(--blue);background:var(--paper);color:var(--blue);margin-top:4px}
.item button.primary{background:var(--blue);color:#fff}
.item button:disabled{opacity:.45}
.daily{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--me-bg);border-color:var(--me)}
.daily .btn{width:auto;padding:10px 14px;font-size:14px;white-space:nowrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
</style>
</head>
<body>
<button class="themebtn" id="theme" title="다크 모드">🌙</button>
<div class="wrap">

<!-- 로비 -->
<div id="lobby">
  <h1>스도쿠 듀얼</h1>
  <p class="sub">실시간으로 겨루는 1:1 스도쿠 대결</p>

  <div class="card" id="authCard">
    <div style="font-weight:700;margin-bottom:10px">로그인</div>
    <input id="lnick" type="text" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
    <input id="lpw" type="password" maxlength="64" placeholder="비밀번호 (4자 이상)" autocomplete="current-password">
    <div class="row"><button class="btn" id="doLogin">로그인</button><button class="btn sec" id="doSignup">가입하기</button></div>
    <div class="cap" style="margin:10px 0 0">한 번 로그인하면 이 기기에서는 자동으로 로그인돼요.</div>
  </div>

  <div id="playCard" class="hide">
    <div class="topbar">
      <div class="tb-who">👤 <b id="who"></b></div>
      <div class="coinpill">🪙 <b id="coins">0</b></div>
      <button class="dailypill hide" id="dailyBtn">🎁 출석 <span id="dailyAmt"></span></button>
    </div>

    <!-- 플레이 탭 -->
    <section class="tabp on" data-tab="play">
      <div class="hero">
        <div class="hero-t">🧩 솔로 모드</div>
        <div class="hero-s">혼자 풀며 기록과 점수를 쌓아요 · 클리어하면 코인!</div>
        <div class="seg hseg">
          <label><input type="radio" name="sd" value="easy"><span>쉬움</span></label>
          <label><input type="radio" name="sd" value="normal" checked><span>보통</span></label>
          <label><input type="radio" name="sd" value="hard"><span>어려움</span></label>
        </div>
        <button class="hero-go" id="solo">▶ 솔로 시작</button>
      </div>

      <div class="tiles">
        <button class="tile" id="match"><span class="ti">⚡</span><b>랜덤 매칭</b><span class="ts">참가비 10🪙 · 승자 +10</span></button>
        <button class="tile" id="openSheet"><span class="ti">👥</span><b>친구와 대결</b><span class="ts">방 만들기 · 판돈 설정</span></button>
      </div>

      <div class="card">
        <div class="ct">🔑 코드로 입장</div>
        <div class="row">
          <input id="code" type="text" maxlength="5" placeholder="방 코드 5자리" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;margin:0">
          <button class="btn sec" id="join" style="flex:0 0 96px">입장</button>
        </div>
      </div>

      <div class="card">
        <div class="ct">🚪 대기 중인 방 <span class="cnt" id="roomCnt"></span></div>
        <div id="roomList"><div class="empty">불러오는 중…</div></div>
      </div>

      <div class="card">
        <div class="ct">🟢 접속 중 <span class="cnt" id="onlineCnt"></span></div>
        <div id="onlineList" class="chips"></div>
      </div>
    </section>

    <!-- 상점 탭 -->
    <section class="tabp" data-tab="shop">
      <div class="card" id="shopCard">
        <div class="ct">🛍️ 상점 <span class="cap" style="display:inline;margin-left:6px" id="soloCap"></span></div>
        <div class="seg" style="margin-top:0">
          <label><input type="radio" name="st" value="theme" checked><span>테마</span></label>
          <label><input type="radio" name="st" value="color"><span>이름 색</span></label>
          <label><input type="radio" name="st" value="title"><span>칭호</span></label>
          <label><input type="radio" name="st" value="effect"><span>승리 연출</span></label>
        </div>
        <div class="items" id="shopItems"></div>
      </div>
    </section>

    <!-- 내 정보 탭 -->
    <section class="tabp" data-tab="me">
      <div class="card">
        <div class="ct">📊 내 기록</div>
        <div id="mystats"></div>
      </div>
      <div class="card">
        <div class="ct">🎁 출석</div>
        <div class="cap" style="margin:0" id="dailyInfo"></div>
      </div>
      <button class="btn gray" id="logout">로그아웃</button>
    </section>
  </div>

  <!-- 랭킹 탭 (로그아웃 상태에서도 보여요) -->
  <section class="tabp" data-tab="rank" id="rankSec">
    <div class="card">
      <div class="ct">🏆 랭킹</div>
      <div class="seg" style="margin-top:0">
        <label><input type="radio" name="rm" value="solo" checked><span>솔로</span></label>
        <label><input type="radio" name="rm" value="race"><span>레이스</span></label>
        <label><input type="radio" name="rm" value="territory"><span>칸 차지</span></label>
      </div>
      <div id="rsolo">
        <div class="seg" style="margin-top:0">
          <label><input type="radio" name="rd" value="easy"><span>쉬움</span></label>
          <label><input type="radio" name="rd" value="normal" checked><span>보통</span></label>
          <label><input type="radio" name="rd" value="hard"><span>어려움</span></label>
        </div>
        <div class="seg" style="margin-top:0">
          <label><input type="radio" name="rb" value="time" checked><span>최단 기록</span></label>
          <label><input type="radio" name="rb" value="score"><span>최고 점수</span></label>
        </div>
      </div>
      <div id="rank"></div>
    </div>
  </section>

  <!-- 하단 탭 바 -->
  <nav class="nav hide" id="nav">
    <button data-tab="play" class="on"><i>🎮</i>플레이</button>
    <button data-tab="rank"><i>🏆</i>랭킹</button>
    <button data-tab="shop"><i>🛍️</i>상점</button>
    <button data-tab="me"><i>👤</i>내 정보</button>
  </nav>

  <!-- 친구와 대결 시트 -->
  <div id="sheet" class="sheet hide">

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('sd_token') || '', user = '';
let sess = null, S = null, es = null, sel = -1, offset = 0, lastSeq = 0, busy = false, firstState = true;
let noteMode = false, notes = new Array(81).fill(0), undo = [];
const cells = [];

/* ---------- 유틸 ---------- */
function toast(msg, ms = 1800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms);
}
async function api(p, body = {}) {
  const r = await fetch('/api/' + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || '오류가 발생했어요'); e.status = r.status; throw e; }
  return j;
}
const now = () => Date.now() + offset;
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const hearts = (n) => '❤️'.repeat(Math.max(0, n)) + '🖤'.repeat(Math.max(0, 3 - n));
const isRace = () => S && (S.mode === 'race' || S.mode === 'solo');

/* ---------- 테마 / 꾸미기 ---------- */
const DEFAULT_THEMES = { light: { id: 'light', base: 'light', vars: {} }, dark: { id: 'dark', base: 'dark', vars: {} } };
let appliedVars = [], shop = null, shopTab = 'theme';
function applyThemeObj(o) {
  const r = document.documentElement;
  appliedVars.forEach((k) => r.style.removeProperty(k)); appliedVars = [];
  r.dataset.theme = o.base;
  for (const [k, v] of Object.entries(o.vars || {})) { r.style.setProperty(k, v); appliedVars.push(k); }
  $('#theme').textContent = o.base === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('sd_theme_obj', JSON.stringify(o)); } catch {}
}
(function () {
  try { const o = JSON.parse(localStorage.getItem('sd_theme_obj') || 'null'); if (o) appliedVars = Object.keys(o.vars || {}); } catch {}
  $('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
})();
$('#theme').onclick = async () => {
  const next = DEFAULT_THEMES[document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'];
  applyThemeObj(next);
  if (token) { try { applyShop(await api('shop/equip', { kind: 'theme', id: next.id })); } catch {} }
};
function setName(el, nick, color, title, suffix) {
  el.textContent = '';
  if (title) { const t = document.createElement('span'); t.className = 'ttl'; t.textContent = title; el.appendChild(t); }
  const n = document.createElement('span'); n.textContent = nick + (suffix || '');
  if (color === 'rainbow') n.className = 'rainbow'; else if (color) n.style.color = color;
  el.appendChild(n);
}

/* ---------- 승리 연출 ---------- */
let fxRaf = 0;
function fx(kind) {
  const cv = $('#fx'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cancelAnimationFrame(fxRaf);
  const rnd = (a, b) => a + Math.random() * (b - a), cols = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#ec4899'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const DUR = kind === 'basic' ? 2400 : 3600;
  let draw;
  if (kind === 'confetti' || kind === 'basic' || kind === 'gold') {
    const n = kind === 'confetti' ? 170 : kind === 'gold' ? 90 : 55;
    const ps = Array.from({ length: n }, () => ({ x: rnd(0, W), y: rnd(-H, 0), vy: rnd(140, 340), vx: rnd(-40, 40), s: rnd(6, 13), a: rnd(0, 6.28), va: rnd(-6, 6), c: pick(cols) }));
    draw = (t, dt) => ps.forEach((p) => {
      p.y += p.vy * dt; p.x += p.vx * dt; p.a += p.va * dt;
      ctx.save(); ctx.translate(p.x, p.y);
      if (kind === 'gold') {
        ctx.scale(Math.abs(Math.cos(p.a)), 1); ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(0, 0, p.s + 3, 0, 6.28); ctx.fill();
        ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, (p.s + 3) * 0.55, 0, 6.28); ctx.stroke();
      } else { ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); }
      ctx.restore();
    });
  } else if (kind === 'hearts') {
    const ps = Array.from({ length: 42 }, () => ({ x: rnd(0, W), y: rnd(H, H * 1.7), vy: -rnd(90, 220), sw: rnd(0, 6.28), s: rnd(20, 42), e: pick(['❤️', '💖', '💗', '💕']) }));
    draw = (t, dt) => ps.forEach((p) => { p.y += p.vy * dt; ctx.font = p.s + 'px serif'; ctx.fillText(p.e, p.x + Math.sin(p.sw + t * 2) * 22, p.y); });
  } else if (kind === 'stars') {
    const sh = Array.from({ length: 16 }, () => ({ x: rnd(W * 0.3, W * 1.2), y: rnd(-120, H * 0.45), vx: -rnd(500, 900), vy: rnd(300, 520), d: rnd(0, 2), len: rnd(90, 170) }));
    const tw = Array.from({ length: 44 }, () => ({ x: rnd(0, W), y: rnd(0, H), ph: rnd(0, 6.28), s: rnd(5, 12) }));
    draw = (t) => {
      tw.forEach((p) => { ctx.save(); ctx.globalAlpha *= Math.abs(Math.sin(t * 3 + p.ph)); ctx.fillStyle = '#fde68a'; ctx.translate(p.x, p.y); ctx.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? p.s * 0.25 : p.s; ctx.lineTo(Math.cos(k * 0.785) * r, Math.sin(k * 0.785) * r); } ctx.closePath(); ctx.fill(); ctx.restore(); });
      sh.forEach((p) => {
        if (t < p.d) return; const a = t - p.d, x = p.x + p.vx * a, y = p.y + p.vy * a, m = Math.hypot(p.vx, p.vy), tx = x - (p.vx / m) * p.len, ty = y - (p.vy / m) * p.len;
        const g = ctx.createLinearGradient(x, y, tx, ty); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.28); ctx.fill();
      });
    };
  } else if (kind === 'fireworks') {
    const N = 72, bursts = Array.from({ length: 6 }, (_, i) => ({ at: i * 0.5 + rnd(0, 0.2), x: rnd(W * 0.15, W * 0.85), y: rnd(H * 0.15, H * 0.5), c: pick(cols), j: Array.from({ length: N }, () => rnd(-0.05, 0.05)), sp: Array.from({ length: N }, () => rnd(60, 200)) }));
    draw = (t) => bursts.forEach((b) => {
      const age = t - b.at; if (age < 0 || age > 1.5) return;
      ctx.save(); ctx.globalAlpha *= 1 - age / 1.5; ctx.fillStyle = b.c;
      for (let k = 0; k < N; k++) { const ang = (k / N) * 6.28 + b.j[k]; ctx.beginPath(); ctx.arc(b.x + Math.cos(ang) * b.sp[k] * age, b.y + Math.sin(ang) * b.sp[k] * age + 120 * age * age, 3.6, 0, 6.28); ctx.fill(); }
      ctx.restore();
    });
  } else if (kind === 'lightning') {
    const fl = [0.1, 0.8, 1.5, 2.2].map((at) => {
      const pts = []; let x = rnd(W * 0.2, W * 0.8); for (let y = 0; y < H; y += rnd(30, 60)) { pts.push([x, y]); x += rnd(-40, 40); }
      return { at, pts };
    });
    draw = (t) => fl.forEach((f) => {
      const age = t - f.at; if (age < 0 || age > 0.4) return; const k = 1 - age / 0.4;
      ctx.save(); ctx.globalAlpha *= k; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = 4; ctx.shadowColor = '#818cf8'; ctx.shadowBlur = 24; ctx.beginPath();
      f.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore();
    });
  } else return;
  const start = performance.now(); let last = start;
  const loop = (now) => {
    const t = (now - start) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H); ctx.globalAlpha = Math.min(1, (DUR / 1000 - t) / 0.7); draw(t, dt); ctx.globalAlpha = 1;
    if (t * 1000 < DUR) fxRaf = requestAnimationFrame(loop); else ctx.clearRect(0, 0, W, H);
  };
  fxRaf = requestAnimationFrame(loop);
}

/* ---------- 코인 / 상점 ---------- */
const EFFECT_ICON = { basic: '🎉', confetti: '🎊', stars: '🌠', hearts: '💖', lightning: '⚡', fireworks: '🎆', gold: '🪙' };
function applyShop(s) {
  shop = s; $('#coins').textContent = s.coins;
  applyThemeObj(s.eqTheme);
  setName($('#who'), user, s.cosm.color, s.cosm.title);
  const d = s.daily;
  $('#dailyBtn').classList.toggle('hide', !d.canClaim);
  $('#dailyAmt').textContent = '+' + d.reward + '🪙';
  $('#dailyInfo').textContent = d.canClaim ? d.day + '일째 출석 보상 +' + d.reward + '🪙을 받을 수 있어요' : '오늘 출석 완료 · 내일 또 오면 보너스가 늘어나요 (최대 +70🪙)';
  $('#soloCap').textContent = '솔로 보상 오늘 ' + s.soloToday + '/' + s.soloCap + '🪙';
  renderShop();
}
async function loadShop() { if (!token) return; try { applyShop(await api('shop')); } catch {} }
$('#dailyBtn').onclick = () => guard(async () => { const r = await api('daily/claim'); applyShop(r); toast('출석 완료! +' + r.claimed + '🪙'); });
document.querySelectorAll('input[name=st]').forEach((r) => r.addEventListener('change', () => { shopTab = r.value; renderShop(); }));
function renderShop() {
  if (!shop) return;
  const box = $('#shopItems'); box.innerHTML = '';
  const equippedId = shop.eq[shopTab];
  shop.catalog[shopTab].forEach((it) => {
    const d = document.createElement('div'), on = it.id === equippedId;
    d.className = 'item' + (on ? ' on' : '');
    const nm = document.createElement('div'); nm.className = 'nm';
    if (shopTab === 'color') setName(nm, it.name, it.css, ''); else nm.textContent = it.name;
    d.appendChild(nm);
    if (shopTab === 'theme') {
      const sw = document.createElement('div'); sw.className = 'sw';
      const v = it.vars || {}, dark = it.base === 'dark';
      sw.style.background = 'linear-gradient(90deg,' + (v['--paper'] || (dark ? '#1b2333' : '#fff')) + ' 0 34%,' + (v['--sel'] || (dark ? '#2f5486' : '#bbdefb')) + ' 34% 67%,' + (v['--blue'] || (dark ? '#4f86f0' : '#325aaf')) + ' 67%)';
      d.appendChild(sw);
    } else if (shopTab === 'effect') {
      const sw = document.createElement('div'); sw.className = 'sw'; sw.textContent = EFFECT_ICON[it.id] || '🎉'; d.appendChild(sw);
    }
    const pr = document.createElement('div'); pr.className = 'pr'; pr.textContent = it.owned ? (it.price ? '보유 중' : '기본') : '🪙 ' + it.price; d.appendChild(pr);
    const btn = document.createElement('button');
    if (!it.owned) { btn.textContent = '구매'; btn.className = 'primary'; btn.disabled = shop.coins < it.price; btn.onclick = () => guard(async () => { applyShop(await api('shop/buy', { kind: shopTab, id: it.id })); toast('구매했어요!'); }); }
    else if (on) {
      if (shopTab === 'color' || shopTab === 'title') { btn.textContent = '해제'; btn.onclick = () => guard(async () => applyShop(await api('shop/equip', { kind: shopTab, id: '' }))); }
      else { btn.textContent = '사용 중'; btn.disabled = true; }
    } else { btn.textContent = '사용하기'; btn.onclick = () => guard(async () => applyShop(await api('shop/equip', { kind: shopTab, id: it.id }))); }
    d.appendChild(btn);
    if (shopTab === 'effect') { const pv = document.createElement('button'); pv.textContent = '미리보기'; pv.onclick = () => fx(it.id); d.appendChild(pv); }
    box.appendChild(d);
  });
}

/* ---------- 효과음 ---------- */
let muted = localStorage.getItem('sd_mute') === '1', actx = null;
function tone(f, d = 0.12, type = 'sine', t0 = 0, vol = 0.08) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const SFX = {
  mine: () => { tone(660, 0.1); tone(880, 0.12, 'sine', 0.08); },
  theirs: () => tone(300, 0.12, 'triangle'),
  wrong: () => tone(180, 0.25, 'sawtooth', 0, 0.06),
  bonus: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.14, 'sine', k * 0.08)),
  freeze: () => { tone(1200, 0.1, 'square', 0, 0.04); tone(800, 0.2, 'square', 0.1, 0.04); },
  tick: () => tone(520, 0.08, 'square', 0, 0.04),
  go: () => tone(880, 0.25, 'square', 0, 0.05),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.16, 'sine', k * 0.1)),
  lose: () => [392, 330, 262, 196].forEach((f, k) => tone(f, 0.2, 'triangle', k * 0.12)),
};
$('#mute').onclick = () => { muted = !muted; localStorage.setItem('sd_mute', muted ? '1' : '0'); $('#mute').textContent = muted ? '🔇' : '🔊'; };
$('#mute').textContent = muted ? '🔇' : '🔊';
let prevStatus = null, prevCd = 0;

/* ---------- 로그인 ---------- */
function setUser(nick, tok) {
  user = nick; if (tok) { token = tok; localStorage.setItem('sd_token', tok); }
  $('#who').textContent = nick;
  $('#authCard').classList.add('hide'); $('#playCard').classList.remove('hide');
  $('#lobby').classList.add('authed'); $('#nav').classList.remove('hide');
  setTab(curTab); loadMyStats(); loadRank(); loadShop(); pollLobby();
}
function showAuth() {
  user = ''; token = ''; localStorage.removeItem('sd_token');
  $('#authCard').classList.remove('hide'); $('#playCard').classList.add('hide');
  $('#lobby').classList.remove('authed'); $('#nav').classList.add('hide');
}
async function auth(kind) {
  const nick = $('#lnick').value.trim(), pw = $('#lpw').value;
  if (!nick || !pw) return toast('닉네임과 비밀번호를 입력해 주세요');
  try { const r = await api(kind, { nick, pw }); $('#lpw').value = ''; setUser(r.nick, r.token); }
  catch (e) { toast(e.message, 2600); }
}
$('#doLogin').onclick = () => auth('login');
$('#doSignup').onclick = () => auth('signup');
$('#lpw').addEventListener('keydown', (e) => { if (e.key === 'Enter') auth('login'); });
$('#logout').onclick = async () => { try { await api('logout'); } catch {} showAuth(); };

/* ---------- 로비 ---------- */
async function loadRank() {
  const val = (n) => document.querySelector('input[name=' + n + ']:checked').value;
  const m = val('rm'), d = val('rd'), by = val('rb');
  $('#rsolo').classList.toggle('hide', m !== 'solo');
  const el = $('#rank');
  try {
    const list = await (await fetch('/api/ranking?mode=' + m + '&diff=' + d + '&by=' + by)).json();
    if (!list.length) { el.innerHTML = '<div class="empty">아직 기록이 없어요. 첫 기록의 주인공이 되어 보세요!</div>'; return; }
    const head = m === 'solo' ? ['#', '닉네임', by === 'score' ? '점수' : '기록', '완료'] : ['#', '닉네임', '승', '패', '승률'];
    el.innerHTML = '<table></table>';
    const tb = el.firstChild, hr = document.createElement('tr');
    head.forEach((t, k) => { const th = document.createElement('th'); if (k === 1) th.style.textAlign = 'left'; th.textContent = t; hr.appendChild(th); });
    tb.appendChild(hr);
    list.slice(0, 10).forEach((r, i) => {
      const tr = document.createElement('tr');
      let row;
      if (m === 'solo') row = [i + 1, r.nick, by === 'score' ? r.value : mmss(r.value), r.done];
      else { const tot = r.wins + r.losses; row = [i + 1, r.nick, r.wins, r.losses, tot ? Math.round((r.wins / tot) * 100) + '%' : '-']; }
      row.forEach((v, k) => { const td = document.createElement('td'); if (k === 1) { td.className = 'n'; if (r.nick === user) td.style.fontWeight = '700'; setName(td, r.nick, r.color, r.title); } else td.textContent = v; tr.appendChild(td); });
      tb.appendChild(tr);
    });
  } catch {}
}
['rm', 'rd', 'rb'].forEach((n) => document.querySelectorAll('input[name=' + n + ']').forEach((r) => r.addEventListener('change', loadRank)));
async function loadMyStats() {
  if (!token) return;
  try {
    const u = await api('mystats'), el = $('#mystats'), names = { easy: '쉬움', normal: '보통', hard: '어려움' };
    let t = '<table><tr><th>솔로</th><th>완료</th><th>최단</th><th>최고점</th><th>평균</th></tr>';
    for (const d of ['easy', 'normal', 'hard']) {

      (r.newBestScore ? '<div style="color:var(--blue);font-weight:700;margin-top:4px">⭐ 최고 점수 갱신!</div>' : '') +
      (r.won ? '<div style="margin-top:6px;font-weight:700">🪙 +' + (r.coins || 0) + (r.capped ? ' <span style="color:var(--mute);font-size:12px;font-weight:400">(오늘 솔로 보상 한도)</span>' : '') + '</div>' : '') +
      (r.won && r.hinted ? '<div style="color:var(--mute);font-size:12px;margin-top:6px">힌트를 쓴 판은 최단 기록에 등록되지 않아요</div>' : '');
    box((r.won
      ? '<div class="res w">클리어! 🎉</div><div style="font-size:15px;margin:6px 0">⏱ ' + mmss(r.time) + ' · 점수 <b>' + r.score + '</b></div><div style="color:var(--mute);font-size:13px">실수 ' + r.mistakes + ' · 힌트 ' + r.hints + '</div>' + badges
      : '<div class="res l">게임 오버</div><div style="color:var(--mute);font-size:14px;margin-bottom:6px">실수 3회로 끝났어요</div>') +
      '<button class="btn" id="sa" style="margin-top:14px">다시 하기</button><button class="btn gray" id="sb" style="margin-top:8px">로비로</button>');
    $('#sa').onclick = () => guard(() => startSolo(S.difficulty));
    $('#sb').onclick = () => toLobby();
  } else if (S.status === 'finished') {
    const win = S.winner === S.you, draw = S.winner === 0;
    const why = {
      board: '판이 모두 채워졌어요', complete: win ? '퍼즐을 먼저 완성했어요' : '상대가 퍼즐을 먼저 완성했어요',
      lives: win ? '상대가 실수 3회로 탈락했어요' : '실수 3회로 탈락했어요',
      cheat: win ? '상대가 부정행위로 정지되어 승리했어요' : '부정행위가 감지되어 계정이 정지됐어요',
      left: win ? '상대가 나갔어요' : '대결에서 나갔어요', disconnect: win ? '상대 연결이 끊겼어요' : '연결이 끊겨 기권 처리됐어요',
    }[S.reason] || '';
    let rm = '다시 대결', dis = false;
    if (me.rematch) { rm = '상대 응답 대기 중…'; dis = true; }
    else if (!op || !op.connected) { rm = '상대가 나갔어요'; dis = true; }
    else if (op.rematch) rm = '상대가 재대결을 원해요!';
    const detail = isRace()
      ? '진행 ' + Math.round((me.cells / S.total) * 100) + '% : ' + (op ? Math.round((op.cells / S.total) * 100) : 0) + '% · 기록 ' + mmss(S.endedAt - S.startedAt)
      : me.score + ' : ' + (op ? op.score : 0) + ' (점령 ' + me.cells + ' : ' + (op ? op.cells : 0) + ')';
    let coin = '';
    if (S.bet > 0 && S.payout) {
      if (S.payout.refund) coin = '<div style="margin-bottom:12px">판돈 ' + S.bet + '🪙 환불</div>';
      else if (win) coin = '<div style="color:var(--blue);font-weight:700;margin-bottom:12px">🪙 +' + (S.payout.amount - S.bet) + (S.payout.bonus ? ' (보너스 +' + S.payout.bonus + ' 포함)' : '') + '</div>';
      else coin = '<div style="color:var(--mute);margin-bottom:12px">🪙 -' + S.bet + '</div>';
    }
    box('<div class="res ' + (draw ? '' : win ? 'w' : 'l') + '">' + (draw ? '무승부' : win ? '승리! 🎉' : '패배') + '</div>' +
      '<div style="color:var(--mute);font-size:14px;margin-bottom:6px">' + why + '</div>' +
      '<div style="font-size:15px;margin-bottom:' + (coin ? '6' : '14') + 'px">' + detail + '</div>' + coin +
      '<button class="btn" id="rm"' + (dis ? ' disabled' : '') + '>' + rm + '</button>' +
      '<button class="btn gray" id="bk" style="margin-top:8px">로비로</button>');
    $('#rm').onclick = () => api('rematch', sess).catch((e) => toast(e.message));
    $('#bk').onclick = async () => { try { await api('leave', sess); } catch {} toLobby(); };
  }
}
function tick() {
  if (!S) return;
  const t = now();
  const tm = $('#timer b');
  if (S.status === 'playing') tm.textContent = mmss(t - S.startedAt);
  else if (S.status === 'finished') tm.textContent = mmss(S.endedAt - S.startedAt);
  else tm.textContent = '0:00';
  if (S.status === 'countdown') { const cd = $('#cd'); const n = Math.max(1, Math.ceil((S.startsAt - t) / 1000)); if (cd) cd.textContent = n; if (n !== prevCd) { prevCd = n; SFX.tick(); } }
  const me = S.players.find((p) => p.idx === S.you), op = S.players.find((p) => p.idx !== S.you);
  const f = $('#frz');
  if (me && me.frozenUntil > t) { f.textContent = '❄️ 동결 ' + Math.ceil((me.frozenUntil - t) / 1000) + '초'; f.classList.remove('hide'); }
  else f.classList.add('hide');
  $('#mf').textContent = me && me.frozenUntil > t ? '❄️ 동결' : '';
  $('#of').textContent = op && op.frozenUntil > t ? '❄️ 동결' : '';
}
setInterval(tick, 200);

/* ---------- 시작 ---------- */
(async function init() {
  const q = new URLSearchParams(location.search).get('room');
  if (q) $('#code').value = q.toUpperCase().slice(0, 5);
  loadRank();
  if (token) {
    try { const r = await api('me'); setUser(r.nick); }
    catch (e) { if (e.status === 401) showAuth(); }
  }
  if (user && sessionStorage.getItem('sd_solo')) {
    try { const r = await api('solo/state'); openSolo(r.state); return; } catch { sessionStorage.removeItem('sd_solo'); }
  }
  try {
    const s = JSON.parse(sessionStorage.getItem('sd_sess') || 'null');
    if (s && s.code && s.pid && !q && user) enter(s.code, s.pid);
  } catch {}
})();
</script>
</body>
</html>
